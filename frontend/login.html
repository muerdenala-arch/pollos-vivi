<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión — Sistema POS</title>
  <meta name="description" content="Acceso al Sistema POS de Pollo y Salchipapas">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <div class="login-page">
    <div class="card login-card">

      <div class="login-logo">
        <div class="login-logo-icon">🍗</div>
        <h1 class="login-title">Sistema POS</h1>
        <p class="login-subtitle">Pollo &amp; Salchipapas</p>
      </div>

      <form id="login-form" class="login-form" autocomplete="off">

        <div class="form-group">
          <label class="form-label" for="username">Usuario</label>
          <input
            class="input-field"
            type="text"
            id="username"
            name="username"
            placeholder="Ej. cajero01"
            autocomplete="username"
            required
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Contraseña</label>
          <input
            class="input-field"
            type="password"
            id="password"
            name="password"
            placeholder="••••••••"
            autocomplete="current-password"
            required
          >
        </div>

        <div id="login-error" class="login-error hidden"></div>

        <button type="submit" id="login-btn" class="btn btn-primary btn-lg login-btn">
          Ingresar al Sistema
        </button>

      </form>

      <div class="login-footer">
        Sistema POS v1.0 · Ing. Rodrigo Zambrana Martinez
      </div>
    </div>
  </div>

  <!-- Toast container -->
  <div id="toast-container" class="toast-container"></div>

  <script type="module">
    import { Auth, saveSession } from './js/api.js';
    import { showToast } from './js/utils.js';

    const form = document.getElementById('login-form');
    const errorEl = document.getElementById('login-error');
    const btn = document.getElementById('login-btn');

    // Si ya hay sesión activa, redirigir según rol
    const token = sessionStorage.getItem('pos_token');
    if (token) {
      const rol = sessionStorage.getItem('pos_rol');
      window.location.href = rol === 'admin' ? '/static/admin.html' : '/static/index.html';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.classList.add('hidden');
      btn.disabled = true;
      btn.textContent = 'Ingresando...';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      try {
        const data = await Auth.login(username, password);
        saveSession(data);

        // Redirigir según rol
        if (data.rol === 'admin') {
          window.location.href = '/static/admin.html';
        } else {
          window.location.href = '/static/index.html';
        }
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'Ingresar al Sistema';
      }
    });
  </script>
</body>
</html>
